<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System - Mark Attendance</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <a href="home.html" class="logo">AMS 📋</a>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="students.html">Students</a>
            <a href="attendance.html" class="active">Attendance</a>
            <a href="student_report.html">Student Report</a>
            <a href="class_report.html">Class Report</a>
        </div>
    </div>

    <div class="container">
        <h1>Mark Daily Attendance</h1>

        <div class="section">
            <h2>Mark Attendance for a Class</h2>
            <div id="attendanceMessage" class="message"></div>
            <div class="form-group">
                <label for="attendanceClass">Select Class:</label>
                <select id="attendanceClass" onchange="loadStudentsForAttendance()">
                    <option value="">-- Select Class --</option>
                    <option value="1">Class 1</option>
                    <option value="2">Class 2</option>
                    <option value="3">Class 3</option>
                    <option value="4">Class 4</option>
                    <option value="5">Class 5</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                </select>
            </div>
            <div class="form-group">
                <label for="attendanceDate">Date:</label>
                <input type="date" id="attendanceDate">
            </div>
            
            <div id="studentAttendanceList">
                <!-- Students for selected class will be loaded here -->
                <p>Please select a class to mark attendance.</p>
            </div>

            <button onclick="submitClassAttendance()">Submit Class Attendance</button>
        </div>

        <div class="section">
            <h2>All Attendance Records</h2>
            <div class="form-group">
                <label for="viewAttendanceClass">Filter by Class:</label>
                <select id="viewAttendanceClass" onchange="loadAttendance()">
                    <option value="">All Classes</option>
                    <option value="1">Class 1</option>
                    <option value="2">Class 2</option>
                    <option value="3">Class 3</option>
                    <option value="4">Class 4</option>
                    <option value="5">Class 5</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                </select>
            </div>
            <button onclick="loadAttendance()">Refresh Records</button>
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Roll Number</th>
                        <th>Class</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('attendanceDate').valueAsDate = new Date();
            loadAttendance();
        });
    </script>
</body>
</html>
