<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System - Student Report</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <a href="home.html" class="logo">AMS 📋</a>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="student_report.html" class="active">Student Report</a>
            <a href="class_report.html">Class Report</a>
        </div>
    </div>

    <div class="container">
        <h1>Individual Student Attendance Report</h1>

        <div class="section">
            <h2>Select Student</h2>
            <div class="form-group">
                <label for="reportStudentSelect">Student:</label>
                <select id="reportStudentSelect" onchange="getStudentAttendanceById()">
                    <option value="">-- Select Student --</option>
                </select>
            </div>

            <div id="studentReportDetails" style="margin-top: 20px; display: none;">
                <h3><span id="reportStudentName"></span> (<span id="reportStudentRoll"></span>) - Class <span id="reportStudentClass"></span></h3>
                <p><strong>Total Days:</strong> <span id="totalDays"></span></p>
                <p><strong>Days Present:</strong> <span id="daysPresent"></span></p>
                <p><strong>Days Absent:</strong> <span id="daysAbsent"></span></p>
                <p><strong>Attendance Percentage:</strong> <span id="attendancePercentage"></span>%</p>

                <h4>Attendance History</h4>
                <table id="individualAttendanceTable">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Attendance records will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div id="studentReportMessage" class="message error" style="display: none;"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadStudentsForReportSelect();
        });
    </script>
</body>
</html>
