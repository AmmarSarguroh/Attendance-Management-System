<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System - Class Report</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <a href="home.html" class="logo">AMS 📋</a>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="students.html">Students</a>
            <a href="attendance.html">Attendance</a>
            <a href="student_report.html">Student Report</a>
            <a href="class_report.html" class="active">Class Report</a>
        </div>
    </div>

    <div class="container">
        <h1>Monthly Class Attendance Report</h1>

        <div class="section">
            <h2>Select Class and Month</h2>
            <div class="form-group">
                <label for="reportClassSelect">Select Class:</label>
                <select id="reportClassSelect" onchange="loadMonthlyClassAttendance()">
                    <option value="">-- Select Class --</option>
                    <option value="1">Class 1</option>
                    <option value="2">Class 2</option>
                    <option value="3">Class 3</option>
                    <option value="4">Class 4</option>
                    <option value="5">Class 5</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                </select>
            </div>
            <div class="form-group">
                <label for="reportMonthSelect">Select Month:</label>
                <input type="month" id="reportMonthSelect" onchange="loadMonthlyClassAttendance()">
            </div>

            <div id="classReportDetails" style="margin-top: 20px; display: none;">
                <h3>Monthly Attendance for <span id="reportClassName"></span> - <span id="reportMonthYear"></span></h3>
                <table id="monthlyClassAttendanceTable">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Roll Number</th>
                            <th>Present Days</th>
                            <th>Absent Days</th>
                            <th>Total Days Marked</th>
                            <th>Attendance %</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Monthly attendance data will be loaded here -->
                    </tbody>
                </table>
            </div>
            <div id="classReportMessage" class="message error" style="display: none;"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const month = (today.getMonth() + 1).toString().padStart(2, '0');
            const year = today.getFullYear();
            document.getElementById('reportMonthSelect').value = `${year}-${month}`;
            // loadMonthlyClassAttendance(); // Load on class selection
        });
    </script>
</body>
</html>
